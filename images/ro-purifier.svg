<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- RO Purifier Cabinet Outer Body -->
  <rect x="20" y="10" width="60" height="78" rx="8" fill="#ffffff" stroke="#1e3a5f" stroke-width="3"/>
  <!-- Top Filter Chamber (Opaque) -->
  <rect x="20" y="10" width="60" height="34" rx="8" fill="#f8fafc" stroke="#1e3a5f" stroke-width="2.5"/>
  <!-- Filter Candles visible silhouette -->
  <rect x="28" y="16" width="10" height="22" rx="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="45" y="16" width="10" height="22" rx="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="62" y="16" width="10" height="22" rx="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Middle Indicator Panel -->
  <rect x="24" y="44" width="52" height="6" rx="2" fill="#e2e8f0"/>
  <circle cx="36" cy="47" r="1.5" fill="#22c55e"/> <!-- Power LED -->
  <circle cx="50" cy="47" r="1.5" fill="#3b82f6"/> <!-- Purification LED -->
  <circle cx="64" cy="47" r="1.5" fill="#eab308"/> <!-- Tank Full LED -->
  <!-- Transparent Water Storage Tank Below -->
  <rect x="26" y="52" width="48" height="30" rx="4" fill="#f0f9ff" stroke="#93c5fd" stroke-width="1.5"/>
  <!-- Water Level Waves -->
  <path d="M28 68 C34 66, 42 70, 50 68 C58 66, 66 70, 72 68" stroke="#0284c7" stroke-width="2" fill="none"/>
  <!-- Pure Water Dispenser Tap -->
  <path d="M50 82 L50 89 L44 89" stroke="#1e3a5f" stroke-width="2.5"/>
  <circle cx="50" cy="82" r="2" fill="#d95300"/>
  <!-- Water Drop from Tap -->
  <path d="M44 94 Q44 92 42.5 92 Q41 92 41 94 Q41 95.5 42.5 95.5 Q44 95.5 44 94 Z" fill="#0284c7" stroke="none"/>
</svg>
